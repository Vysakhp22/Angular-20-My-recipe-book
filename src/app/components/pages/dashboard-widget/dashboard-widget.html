<div class="grid grid-cols-2 gap-6 md:grid-cols-4 mb-4">
    <!-- Card 1 with gradient -->
    <div
        class="bg-gradient-to-r from-teal-400 to-green-200 text-white p-4 rounded-lg shadow text-center h-36 flex flex-col justify-center items-center transform transition duration-300 hover:shadow-lg hover:scale-105">
        <div class="text-6xl font-bold" appCountup [targetValue]="10">10</div>
        <div class="text-lg">Total Recipes</div>
    </div>

    <!-- Card 2 -->
    <div
        class="bg-white p-4 rounded-lg shadow text-center h-36 flex flex-col justify-center items-center text-gray-800 transform transition duration-300 hover:shadow-lg hover:scale-105">
        <div class="text-6xl font-bold" appCountup [targetValue]="categoriesCount()">{{ categoriesCount() }}</div>
        <div class="text-lg text-gray-600">Categories</div>
    </div>

    <!-- Card 3 -->
    <div
        class="bg-white p-4 rounded-lg shadow text-center h-36 flex flex-col justify-center items-center text-gray-800 transform transition duration-300 hover:shadow-lg hover:scale-105">
        <div class="text-6xl font-bold" appCountup [targetValue]="3">3</div>
        <div class="text-lg text-gray-600">Favorites</div>
    </div>

    <!-- Card 4 -->
    <div
        class="bg-white p-4 rounded-lg shadow text-center h-36 flex flex-col justify-center items-center text-gray-800 transform transition duration-300 hover:shadow-lg hover:scale-105">
        <div class="text-6xl font-bold" appCountup [targetValue]="5">5</div>
        <div class="text-lg text-gray-600">Meal Plans</div>
    </div>
</div>


<!--  This button is for creating a new recipe. -->
<div
    class="inline-block p-[4px] rounded-lg bg-gradient-to-r from-[#1abc9c] via-[#3498db] to-[#a3e4d7] hover:from-[#45b39d] hover:to-[#3498db] transition-all duration-500">
    <button (click)="openAddRecipeDialog()"
        class="bg-[#73c6b6] hover:bg-[#45b39d] text-white p-4 rounded-lg shadow-md w-72 h-20 flex justify-center items-center cursor-pointer transition-all duration-300 active:scale-95 active:shadow-inner active:bg-[#3a8a7a] transform">
        <span class="text-lg flex items-center gap-2 active:scale-95 transition-transform duration-150">
            <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span class="font-semibold text-2xl tracking-wide drop-shadow-md active:drop-shadow-sm transition-all duration-150 transform active:scale-95 text-shadow-glow">
                New Recipe
            </span>
        </span>
    </button>
</div>

<div class="w-full flex h-full mt-4">
    <div class="w-[70%]">
        @defer () {
        <app-dashboard-recent-recipes></app-dashboard-recent-recipes>
        }
    </div>
    <div class="flex-1 ml-4 space-y-4 h-full">
        <h3 class="text-2xl font-semibold mb-4 text-[#4a3f35]">Categories</h3>
        <div class="bg-white p-4 rounded-lg shadow-md">
            <ul class="space-y-4 text-gray-800">
                <li class="flex items-center gap-2">
                    <svg class="w-6 h-6 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span>All</span>
                </li>
                <li class="flex items-center gap-2">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="6" fill="#FFEFC9" />
                        <path
                            d="M17 8h-1V6H6v8a4 4 0 0 0 4 4h2a4 4 0 0 0 4-4v-1h1a2 2 0 0 0 0-4zm-2 6a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V8h7v6zm2-3h-1V9h1a1 1 0 0 1 0 2z"
                            fill="#FFB300" />
                    </svg>
                    <span>Breakfast</span>
                </li>
                <li class="flex items-center gap-2">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="6" fill="#D5F7E6" />
                        <path d="M7 5c-1.1 0-2 .9-2 2v7h2v5l2-1 2 1v-5h2v5l2-1 2 1v-5h2V7c0-1.1-.9-2-2-2H7z"
                            fill="#00C292" />
                    </svg>
                    <span>Lunch</span>
                </li>
                <li class="flex items-center gap-2">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="6" fill="#FFE3E1" />
                        <path d="M12 2v8h-1V2h-1v8H9V2H8v8c0 1.1.9 2 2 2h1v10h2V12h1a2 2 0 0 0 2-2V2h-1v8h-1V2h-1z"
                            fill="#FF6B6B" />
                    </svg>
                    <span>Dinner</span>
                </li>
                <li>
                    <button (click)="openAddCategoryDialog()"
                        class="flex items-center gap-2 w-full px-3 py-2 border border-dashed border-blue-500 text-blue-600 rounded-md hover:bg-blue-50 transition">
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" fill="white" />
                            <path d="M12 8v8M8 12h8" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <span class="font-medium">Add New Category</span>
                    </button>
                </li>

            </ul>
        </div>
    </div>
</div>
