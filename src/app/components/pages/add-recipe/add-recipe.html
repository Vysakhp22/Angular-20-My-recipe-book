<div class="w-full max-w-md bg-white mx-auto relative p-4">
    <!-- Header -->
    <div class="mb-4">
        <h2 class="text-xl font-bold text-[#4a3f35]">Add Recipe</h2>
    </div>

    <!-- Close Button -->
    <div class="absolute top-2 right-2">
        <button
            class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full transition transform active:scale-95 focus:outline-none"
            (click)="closeDialog()" aria-label="Close" title="Close">
            <svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    <!-- Recipe Form -->
    <form autocomplete="off" [formGroup]="recipeForm" (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-2 mb-5">

            <input type="text"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#4a3f35] transition"
                placeholder="Enter recipe name" formControlName="title" />

            <div class="w-full flex items-center gap-2">
                <select formControlName="category"
                    class="select border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#4a3f35] transition">
                    <option value="" disabled selected>Pick a category</option>
                    @for (item of dialogData.categories; track $index) {
                    <option [value]="item.id">{{ item.name }}</option>
                    }
                </select>
                <input type="text" formControlName="duration"
                    class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#4a3f35] transition"
                    placeholder="Enter cooking time" />
            </div>

            <div formArrayName="ingredients" class="space-y-4 w-full">
                @for (item of ingredients.controls; track item;) {
                <div class="flex items-center gap-1" [formGroupName]="$index">
                    @if ($index === 0) {
                    <button type="button" (click)="addIngredient()"
                        class="text-green-500 transition flex-shrink-0 border border-green-300 rounded-full p-1 border-solid hover:bg-green-50">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                    } @else {
                    <button type="button" (click)="removeIngredient($index)"
                        class="text-red-500 transition flex-shrink-0 border border-red-300 rounded-full p-1 border-solid hover:bg-red-50">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                    }
                    <input type="text" formControlName="name"
                        class="flex-1 border border-gray-300 rounded-lg px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3f35] transition"
                        placeholder="Ingredient" />
                    <input type="text" formControlName="quantity"
                        class="w-40 border border-gray-300 rounded-lg px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3f35] transition"
                        placeholder="Quantity" />
                </div>
                }
            </div>


            <!-- <button 
                class="w-56 inline-flex items-center justify-center px-4 py-2 border border-dashed border-blue-500 text-blue-600 text-sm font-semibold rounded-lg transition transform active:scale-95 focus:outline-none">
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="white" />
                    <path d="M12 8v8M8 12h8" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span class="font-medium">Add Ingedients</span>
            </button> -->

            <textarea class="textarea" placeholder="Enter recipe instructions" formControlName="instructions" rows="8"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#4a3f35] transition"></textarea>
        </div>

        <div class="flex justify-end">
            <button type="submit"
                class="px-4 py-2 bg-[#4a3f35] text-white text-sm font-semibold rounded-lg transition transform active:scale-95 hover:bg-[#3a312a] focus:outline-none">
                Save Recipe
            </button>
            <button type="button" (click)="closeDialog()"
                class="ml-2 px-4 py-2 bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg transition transform active:scale-95 hover:bg-gray-300 focus:outline-none">
                Cancel
            </button>

        </div>

    </form>
</div>
